<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>관리자 | 제이앤제이(J&amp;J)</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
  </defs></svg>

  <!-- 로그인 -->
  <main class="login" id="login-view" hidden>
    <form class="login__box" id="login-form">
      <a href="index.html" class="logo" aria-label="제이앤제이 홈"><img class="logo__img" src="images/logo-sm.png" alt="" width="161" height="88" /><span class="logo__text"><span class="logo__name">제이앤제이</span><span class="logo__en">ADMIN</span></span></a>
      <h1>관리자 로그인</h1>
      <p class="login__mode" id="login-mode"></p>
      <div class="field" id="email-field">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <p class="field__error" id="login-error" role="alert"></p>
      <button type="submit" class="btn btn--primary btn--l">로그인</button>
      <a href="index.html" class="login__back">← 홈페이지로 돌아가기</a>
    </form>
  </main>

  <!-- 대시보드 -->
  <div id="app-view" hidden>
    <header class="a-header">
      <div class="a-header__inner">
        <a href="index.html" class="logo" aria-label="제이앤제이 홈"><img class="logo__img" src="images/logo-sm.png" alt="" width="161" height="88" /><span class="logo__text"><span class="logo__name">제이앤제이</span><span class="logo__en">ADMIN</span></span></a>
        <div class="a-header__util">
          <a href="index.html" target="_blank" rel="noopener" class="btn btn--ghost btn--s">사이트 보기<svg aria-hidden="true"><use href="#i-external"/></svg></a>
          <button type="button" class="btn btn--ghost btn--s" id="logout">로그아웃</button>
        </div>
      </div>
    </header>

    <main class="a-main">
      <div class="a-banner" id="demo-banner" hidden>
        <strong>데모 모드</strong>
        <span>지금은 게시물이 <b>이 브라우저에만</b> 저장됩니다. 방문자에게 보이게 하려면 Supabase 연결이 필요합니다 (supabase/README.md).</span>
        <button type="button" class="btn btn--ghost btn--xs" id="demo-reset">데모 게시물 모두 지우기</button>
      </div>

      <div class="a-toolbar">
        <div class="seg-tabs" role="tablist" aria-label="게시판 선택">
          <span class="seg-tabs__ind" aria-hidden="true"></span>
          <button type="button" role="tab" data-type="news" aria-selected="true">소식</button>
          <button type="button" role="tab" data-type="notice" aria-selected="false">공지사항</button>
        </div>
        <button type="button" class="btn btn--primary" id="new-post"><svg aria-hidden="true"><use href="#i-plus"/></svg>새 글 작성</button>
      </div>

      <div class="a-table-wrap">
        <table class="a-table">
          <thead><tr id="table-head"></tr></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- 글쓰기 / 수정 -->
  <div class="modal" id="editor" hidden>
    <div class="modal__dim" data-close></div>
    <form class="modal__box" id="editor-form" aria-labelledby="editor-title" novalidate>
      <div class="modal__head">
        <h2 id="editor-title">새 글 작성</h2>
        <button type="button" class="modal__close" data-close aria-label="닫기"><svg aria-hidden="true"><use href="#i-x"/></svg></button>
      </div>
      <div class="modal__body">
        <div class="field-row">
          <div class="field" data-only="news">
            <label for="f-category">분류 <i>*</i></label>
            <select id="f-category" name="category"></select>
          </div>
          <div class="field">
            <label for="f-date">게시일 <i>*</i></label>
            <input type="date" id="f-date" name="date" required />
          </div>
          <div class="field field--check" data-only="notice">
            <label><input type="checkbox" name="pinned" /> 상단 고정 공지</label>
          </div>
        </div>
        <div class="field">
          <label for="f-title">제목 <i>*</i></label>
          <input type="text" id="f-title" name="title" maxlength="120" required />
        </div>
        <div class="field" data-only="news">
          <label>대표 이미지</label>
          <div class="upload" id="upload">
            <input type="file" id="f-file" accept="image/*" class="sr-only" />
            <label for="f-file" class="upload__drop" id="upload-drop">
              <img id="upload-preview" alt="" hidden />
              <span class="upload__empty"><svg aria-hidden="true"><use href="#i-image"/></svg>클릭하거나 이미지를 끌어다 놓으세요<small>JPG·PNG, 자동으로 크기가 줄어듭니다</small></span>
            </label>
            <button type="button" class="btn btn--ghost btn--xs" id="upload-remove" hidden>이미지 삭제</button>
          </div>
        </div>
        <div class="field">
          <label for="f-content">내용 <i>*</i></label>
          <textarea id="f-content" name="content" rows="12" required placeholder="빈 줄로 문단을 나눌 수 있습니다. 링크(https://…)는 자동으로 연결됩니다."></textarea>
        </div>
        <p class="field__error" id="editor-error" role="alert"></p>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--ghost" data-close>취소</button>
        <button type="submit" class="btn btn--primary" id="editor-submit">저장</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
